[project]
name = "rescue"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "adi-mauryaji", email = "aditya1925011@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "geoalchemy2>=0.21.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I import order · UP pyupgrade · B bugbear
# SIM simplify · S security (blueprint 20.2, 22) · RUF ruff's own
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and talk to a throwaway database with a visible password.
"tests/*" = ["S101", "S105", "S106"]
# Migrations hold the blueprint's DDL verbatim: long lines stay as reviewed.
"migrations/versions/*" = ["E501"]
